name: Deploy to VPS

on:
  push:
    branches:
      - main

# Prevent overlapping deployments
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 12m
          script: |
            cd /var/www/Zagroda_adoption
            bash scripts/deploy-vps.sh

      - name: Notify Stef Dashboard (success)
        if: success()
        run: |
          curl -s -X POST https://stef.futuresolutionsai.com/api/logs \
            -H "Content-Type: application/json" \
            -H "X-API-Key: fs-log-key-2026" \
            -d '{
              "app": "zagroda-website",
              "level": "info",
              "message": "✅ Deployment succeeded via GitHub Actions (Run #${{ github.run_number }}, commit ${{ github.sha }})",
              "metadata": {
                "run_number": ${{ github.run_number }},
                "commit": "${{ github.sha }}",
                "ref": "${{ github.ref }}",
                "actor": "${{ github.actor }}",
                "deploy_method": "github-actions"
              }
            }'

      - name: Notify Stef Dashboard (failure)
        if: failure()
        run: |
          curl -s -X POST https://stef.futuresolutionsai.com/api/logs \
            -H "Content-Type: application/json" \
            -H "X-API-Key: fs-log-key-2026" \
            -d '{
              "app": "zagroda-website",
              "level": "critical",
              "message": "❌ DEPLOYMENT FAILED — GitHub Actions Run #${{ github.run_number }} (commit ${{ github.sha }}). DO NOT hotfix via SSH — investigate and re-push.",
              "metadata": {
                "run_number": ${{ github.run_number }},
                "commit": "${{ github.sha }}",
                "ref": "${{ github.ref }}",
                "actor": "${{ github.actor }}",
                "deploy_method": "github-actions",
                "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            }'
